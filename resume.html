<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Preview & Download</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="resume-container">
        <!-- Action Header -->
        <header class="action-header">
            <h2>My Professional Resume</h2>
            <!-- The 'download' attribute forces browsers to download the file instead of just opening it -->
            <a href="/MartinQuintanaResume.pdf" download="MartinQuintanaResume.pdf" class="download-btn">
                Download PDF
            </a>
        </header>
        <iframe src="MartinQuintanaResume.pdf" width="100%" height="600px" style="border: none;"></iframe>
    </main>

</body>
</html>
